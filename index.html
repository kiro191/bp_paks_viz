<!DOCTYPE html>
<html>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1'>
  <title>Budapest Paks Mobil</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, Arial;
      background: #f6f7f8;
      color: #111;
      text-align: center;
    }
    .top {
      padding: 12px;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .top a {
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 20px;
    }
    .wrap {
      padding: 20px 16px 30px;
      max-width: 480px;
      margin: 0 auto;
    }
    .card {
      background: #fff;
      border-radius: 20px;
      padding: 24px 18px;
      margin: 16px 0;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }
    .city {
      font-size: 13px;
      letter-spacing: 3px;
      color: #888;
      font-weight: 700;
    }
    .river {
      font-size: 18px;
      margin: 4px 0;
      color: #444;
    }
    .water {
      font-size: 88px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      margin: 12px 0;
    }
    .unit {
      font-size: 18px;
      color: #666;
      margin-bottom: 8px;
    }
    .time {
      font-size: 15px;
      color: #666;
      background: #f0f1f3;
      display: inline-block;
      padding: 6px 14px;
      border-radius: 20px;
      margin-top: 8px;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 18px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      margin: 18px 0;
    }
    .btn2 {
      display: block;
      width: 100%;
      padding: 14px;
      background: #fff;
      color: #111;
      border: 2px solid #111;
      text-decoration: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class='top'>
    <span>DUNA VIZALLAS</span>
    <a href='bp_d_asztali.html'>Asztali nézet</a>
  </div>
  <div class='wrap'>
    <div class='card'><div class='city'>BUDAPEST</div><div class='river'>DUNA 1646.5 fkm</div><div class='water'>17</div><div class='unit'>cm</div><div class='time'>2026.09.07. 04:00</div></div>
    <a class='btn' href='bp_d_graf_mob.html'>Grafikon megnyitása</a>
    <div class='card'><div class='city'>PAKS</div><div class='river'>DUNA 1531.3 fkm</div><div class='water'>-91</div><div class='unit'>cm</div><div class='time'>2026.09.07. 04:00</div></div>
    <a class='btn2' href='bp_d_graf.html'>Grafikon asztali nézet</a>
    <p style='font-size:12px;color:#999;margin-top:22px'>Forrás: Vízügyi honlap - mobilbarát verzió</p>
  </div>
</body>
</html>
