<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budapest Paks Grafikon</title>

  <!--
    EZ A FAJL SOSEM ISMETLODIK UJRA - nem az R szkriptek allitjak elo, es
    nem is kell nekik ujragyartaniuk. Ez egy STATIKUS HTML oldal, ami
    BONGESZOBEN, JavaScript-tel minden megnyitaskor ujratolti a legfrissebb
    "bp_d_adat.txt" fajlt, es abbol rajzolja fel a grafikont a Chart.js
    nevu, kesz JavaScript konyvtar segitsegevel (ezt egy kulso, publikus
    cimrol toltjuk be, nem kell installalni semmit).

    Ha ezt a fajlt egyszer feltoltod a repoba, onnantol MINDIG a legfrissebb
    adatot fogja mutatni, amig a "bp_d_adat.txt" frissul - nincs szukseg
    arra, hogy barmelyik R szkript ujrairja ezt a HTML-t.
  -->

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      color: #111;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .top a {
      padding: 10px 16px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
    .top a.secondary {
      background: #fff;
      color: #111;
      border: 1px solid #111;
    }
    h1 {
      font-size: 22px;
      text-align: center;
      margin: 6px 0 18px;
    }
    .chart-box {
      width: 100%;
      height: 65vh;
      min-height: 420px;
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      border: 1px solid #eee;
      box-sizing: border-box;
    }
    .info {
      font-size: 13px;
      color: #666;
      text-align: center;
      margin: 12px 0 4px;
    }
    .hint {
      font-size: 12px;
      color: #888;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="top">
      <a href="bp_d_asztali.html">&larr; Asztali kijelző</a>
      <a class="secondary" href="bp_d_graf_mob.html">Mobil grafikon</a>
      <a class="secondary" href="index.html">Mobil kijelző</a>
    </div>

    <h1>Budapest &ndash; Paks vízállás (teljes elérhető idősor)</h1>

    <div class="chart-box">
      <canvas id="chart"></canvas>
    </div>

    <div class="info" id="info">Adatok betöltése...</div>
    <div class="hint">Az adatok automatikusan frissülnek minden alkalommal, amikor újratöltöd ezt az oldalt.</div>
  </div>

  <!-- A Chart.js konyvtar betoltese egy kozismert, publikus CDN-rol. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    // ------------------------------------------------------------------
    // Ez a JavaScript resz fut le a bongeszodben, amikor megnyitod az
    // oldalt. Lepesei:
    //   1. Letolti a "bp_d_adat.txt" fajlt (ugyanabbol a mappabol, ahol
    //      ez a HTML is van).
    //   2. Soronkent feldarabolja pontosvesszo (;) menten:
    //      idopont ; budapest ertek ; paks ertek
    //   3. Az "NA" szoveget "ures" (null) ertekre cutkalja, hogy a
    //      grafikonon lyukkent (nem hibas nullaertekkent) jelenjen meg.
    //   4. A Chart.js segitsegevel felrajzolja a ket vonalat.
    // ------------------------------------------------------------------

    // A "?t=..." a fajlnev vegen csak azert kell, hogy a bongeszo
    // gyorsitotara (cache) sose adjon vissza regi, elavult valaszt -
    // minden megnyitaskor egy uj, egyedi szamot generalunk.
    const adatUrl = "bp_d_adat.txt?t=" + Date.now();

    fetch(adatUrl)
      .then(function (valasz) {
        if (!valasz.ok) {
          throw new Error("A bp_d_adat.txt nem erheto el (HTTP " + valasz.status + ")");
        }
        return valasz.text();
      })
      .then(function (szoveg) {
        const sorok = szoveg.split("\n").map(function (s) { return s.trim(); }).filter(Boolean);

        const cimkek = [];      // az idopontok (x tengely)
        const budapest = [];    // budapesti vizallas ertekek
        const paks = [];        // paksi vizallas ertekek

        sorok.forEach(function (sor) {
          const reszek = sor.split(";");
          if (reszek.length < 3) return;

          const idopont = reszek[0].trim();
          const bp = reszek[1].trim();
          const pk = reszek[2].trim();

          cimkek.push(idopont);
          budapest.push(bp === "NA" || bp === "" ? null : Number(bp));
          paks.push(pk === "NA" || pk === "" ? null : Number(pk));
        });

        document.getElementById("info").textContent =
          "Betöltött órák száma: " + cimkek.length +
          (cimkek.length > 0 ? " | Legfrissebb: " + cimkek[cimkek.length - 1] : "");

        const ctx = document.getElementById("chart").getContext("2d");

        new Chart(ctx, {
          type: "line",
          data: {
            labels: cimkek,
            datasets: [
              {
                label: "Budapest (cm)",
                data: budapest,
                borderColor: "#1565c0",
                backgroundColor: "transparent",
                borderWidth: 2,
                pointRadius: 0,
                spanGaps: false,   // NA (null) helyen tenyleg szakadjon meg a vonal
                tension: 0.1
              },
              {
                label: "Paks (cm)",
                data: paks,
                borderColor: "#c62828",
                backgroundColor: "transparent",
                borderWidth: 2,
                pointRadius: 0,
                spanGaps: false,
                tension: 0.1
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            scales: {
              x: {
                ticks: { maxTicksLimit: 14, autoSkip: true }
              },
              y: {
                title: { display: true, text: "cm" }
              }
            },
            plugins: {
              legend: { position: "top" }
            }
          }
        });
      })
      .catch(function (hiba) {
        document.getElementById("info").textContent =
          "Hiba történt az adatok betöltésekor: " + hiba.message;
      });
  </script>
</body>
</html>
